name: release

# gpui compiles its HLSL shaders in a build step gated on the *host* being
# Windows, so nothing here can be cross-compiled. Each target builds natively.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: rtsp-player
            asset: rtsp-player-linux-x86_64
          - os: windows-latest
            bin: rtsp-player.exe
            asset: rtsp-player-windows-x86_64.exe
          - os: macos-latest
            bin: rtsp-player
            asset: rtsp-player-macos-aarch64
            optional: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-x11-dev libxcb1-dev libfontconfig-dev \
            libfreetype6-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.asset }}

      - run: cargo build --release

      - name: Stage the binary
        shell: bash
        run: cp "target/release/${{ matrix.bin }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    # Publish whatever built, so an optional target failing does not block it.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
