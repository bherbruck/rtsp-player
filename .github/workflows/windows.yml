name: windows

# gpui compiles its HLSL shaders in a build step gated on the *host* being
# Windows, so the app cannot be cross-compiled from Linux. Build it here.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: rtsp-player-windows-x86_64
          path: target/release/rtsp-player.exe
          if-no-files-found: error
