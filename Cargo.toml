[package]
name = "rtsp-player"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
futures = "0.3.34"
gpui = "0.2.2"
gpui-component = "0.5.1"
image = "0.25"
percent-encoding = "2.3.2"
retina = "0.4.20"
rust_h265 = "0.1.0"
rusty_h264 = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
url = "2.5.8"
uuid = { version = "1.25.0", features = ["v4", "serde"] }
